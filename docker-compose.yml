# Local setup with PostgreSQL:
#   docker compose up --build
#   docker compose exec web python demo_data.py    # optional demo data
# Then open http://localhost:8000

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://crm:crm@db:5432/crm
      SECRET_KEY: ${SECRET_KEY:-change-me-local-development-only}
      DEMO_MODE: ${DEMO_MODE:-false}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
